<script>
(()=>{
 'use strict';
 const choices=['biologia','ingles'];
 const initialized=new Set();
 const tabs=document.querySelector('[role="tablist"]');
 const error=document.getElementById('error');
 function loadCourse(course){
  if(initialized.has(course))return;
  initialized.add(course);
  const frame=document.getElementById('frame-'+course);
  const loading=document.getElementById('loading-'+course);
  try{
   const b64=document.getElementById('content-'+course).textContent.trim();
   const bytes=Uint8Array.from(atob(b64),ch=>ch.charCodeAt(0));
   const documentText=new TextDecoder('utf-8').decode(bytes);
   frame.addEventListener('load',()=>{loading.hidden=true},{once:true});
   // srcdoc keeps every source style, script, and page behavior inside its own document.
   frame.srcdoc=documentText;
  }catch(e){loading.hidden=true;error.hidden=false;error.textContent='Não foi possível abrir a matéria. '+e.message;}
 }
 function select(course,focus=false){
  choices.forEach(choice=>{
   const current=choice===course;
   const tab=document.getElementById('tab-'+choice);
   tab.setAttribute('aria-selected',String(current));
   tab.tabIndex=current?0:-1;
   document.getElementById('pane-'+choice).hidden=!current;
  });
  loadCourse(course);
  if(focus)document.getElementById('tab-'+course).focus();
  try{localStorage.setItem('central-bio-ingles-aba-v1',course)}catch{}
 }
 tabs.addEventListener('click',e=>{const tab=e.target.closest('button[data-course]');if(tab)select(tab.dataset.course)});
 tabs.addEventListener('keydown',e=>{
  if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
  e.preventDefault();
  const active=choices.findIndex(x=>document.getElementById('tab-'+x).getAttribute('aria-selected')==='true');
  const next=e.key==='Home'?0:e.key==='End'?choices.length-1:(active+(e.key==='ArrowRight'?1:-1)+choices.length)%choices.length;
  select(choices[next],true);
 });
 let start='biologia';
 try{const p=localStorage.getItem('central-bio-ingles-aba-v1');if(choices.includes(p))start=p}catch{}
 select(start);
})();
</script>
</body>
</html>
